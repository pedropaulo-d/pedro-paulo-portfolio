<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Prévia de projeto de Dados e Engenharia">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1220"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="ac4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <pattern id="grid4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg4)"/>
  <rect width="800" height="500" fill="url(#grid4)"/>
  <circle cx="120" cy="120" r="140" fill="#38BDF8" opacity="0.10"/>
  <circle cx="690" cy="400" r="130" fill="#22C55E" opacity="0.08"/>
  <!-- pipeline nodes -->
  <g stroke="url(#ac4)" stroke-width="3" fill="none">
    <path d="M120 250 H300 M380 250 H560 M640 250 H720"/>
  </g>
  <g fill="#101827" stroke="url(#ac4)" stroke-width="3">
    <rect x="100" y="225" width="50" height="50" rx="10"/>
    <rect x="300" y="225" width="80" height="50" rx="10"/>
    <rect x="560" y="225" width="80" height="50" rx="10"/>
    <rect x="700" y="225" width="50" height="50" rx="10"/>
  </g>
  <g font-family="'JetBrains Mono','Consolas',monospace" font-size="14" fill="#38BDF8" text-anchor="middle">
    <text x="125" y="255">API</text>
    <text x="340" y="255">ETL</text>
    <text x="600" y="255">DB</text>
    <text x="725" y="255">BI</text>
  </g>
  <!-- bars -->
  <g fill="url(#ac4)" opacity="0.85">
    <rect x="120" y="360" width="26" height="60" rx="4"/>
    <rect x="160" y="330" width="26" height="90" rx="4"/>
    <rect x="200" y="300" width="26" height="120" rx="4"/>
    <rect x="240" y="345" width="26" height="75" rx="4"/>
  </g>
  <text x="60" y="80" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#94A3B8">Dados &amp; Engenharia</text>
</svg>
